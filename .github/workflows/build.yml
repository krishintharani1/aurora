name: Build Aurora Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p aurora/app/src/main/java/com/krishin/aurora aurora/app/src/main/res/values
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > aurora/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AuroraLauncher"
          include(":app")
          EOF
          cat > aurora/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > aurora/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > aurora/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.krishin.aurora"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.krishin.aurora"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
                  buildConfigField("String", "TMDB_KEY", "\"${project.findProperty("TMDB_KEY") ?: ""}\"")
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                      signingConfig = signingConfigs.getByName("debug") // fine for sideloading on your own TV
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.tv:tv-material:1.0.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
          }
          EOF
          cat > aurora/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET" />
          
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
          
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          
              <application
                  android:label="Aurora"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.Aurora"
                  android:hardwareAccelerated="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:resumeWhilePausing="true"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > aurora/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Aurora" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF
          cat > aurora/app/src/main/java/com/krishin/aurora/MainActivity.kt <<'EOF'
          package com.krishin.aurora
          
          import android.app.Application
          import android.content.*
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.Crossfade
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.BlurredEdgeTreatment
          import androidx.compose.ui.draw.blur
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.focus.FocusRequester
          import androidx.compose.ui.focus.focusRequester
          import androidx.compose.ui.focus.onFocusChanged
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.Shape
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.layout.onGloballyPositioned
          import androidx.compose.ui.layout.positionInRoot
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.core.graphics.drawable.toBitmap
          import androidx.core.net.toUri
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import androidx.tv.material3.*
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.roundToInt
          
          // ───────────────────────── data ─────────────────────────
          
          class AppEntry(
              val label: String,
              val pkg: String,
              val intent: Intent,
              val banner: ImageBitmap?,
              val icon: ImageBitmap,
          )
          
          data class Title(
              val id: Int, val name: String, val overview: String, val year: String,
              val rating: Double, val backdrop: String, val isTv: Boolean,
          )
          
          data class Shelf(val title: String, val items: List<Title>)
          
          object Tmdb {
              private const val BASE = "https://api.themoviedb.org/3"
              const val IMG = "https://image.tmdb.org/t/p/"
          
              fun get(path: String): String? = runCatching {
                  val sep = if (path.contains("?")) "&" else "?"
                  val c = URL("$BASE$path${sep}api_key=${BuildConfig.TMDB_KEY}&language=en-US")
                      .openConnection() as HttpURLConnection
                  c.connectTimeout = 8000; c.readTimeout = 8000
                  c.inputStream.bufferedReader().use { it.readText() }
              }.getOrNull()
          
              fun parse(json: String, forceTv: Boolean?): List<Title> {
                  val arr = JSONObject(json).getJSONArray("results")
                  return (0 until arr.length()).mapNotNull { i ->
                      val o = arr.getJSONObject(i)
                      val type = o.optString("media_type")
                      if (type == "person") return@mapNotNull null
                      val bd = o.optString("backdrop_path")
                      if (bd.isEmpty() || bd == "null") return@mapNotNull null
                      val tv = forceTv ?: (type == "tv")
                      Title(
                          id = o.getInt("id"),
                          name = o.optString(if (tv) "name" else "title"),
                          overview = o.optString("overview"),
                          year = o.optString(if (tv) "first_air_date" else "release_date").take(4),
                          rating = o.optDouble("vote_average", 0.0),
                          backdrop = bd,
                          isTv = tv,
                      )
                  }
              }
          
              fun imdbId(t: Title): String? =
                  get("/${if (t.isTv) "tv" else "movie"}/${t.id}/external_ids")?.let {
                      JSONObject(it).optString("imdb_id").takeIf { s -> s.startsWith("tt") }
                  }
          }
          
          // ───────────────────────── view model ─────────────────────────
          
          class AppsViewModel(app: Application) : AndroidViewModel(app) {
              private val _apps = MutableStateFlow<List<AppEntry>>(emptyList())
              val apps = _apps.asStateFlow()
              private val _shelves = MutableStateFlow<List<Shelf>>(emptyList())
              val shelves = _shelves.asStateFlow()
          
              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) = loadApps()
              }
          
              private val defs = listOf(
                  Triple("Trending Today", "/trending/all/day", null as Boolean?),
                  Triple("Popular Movies", "/movie/popular", false),
                  Triple("Top Rated Movies", "/movie/top_rated", false),
                  Triple("Popular Series", "/tv/popular", true),
                  Triple("Now Playing", "/movie/now_playing", false),
              )
          
              init {
                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_REPLACED)
                      addDataScheme("package")
                  }
                  ContextCompat.registerReceiver(app, receiver, f, ContextCompat.RECEIVER_EXPORTED)
                  loadApps()
                  loadShelves()
              }
          
              fun loadApps() {
                  viewModelScope.launch(Dispatchers.Default) { _apps.value = queryApps() }
              }
          
              private fun loadShelves() {
                  if (BuildConfig.TMDB_KEY.isBlank()) return
                  viewModelScope.launch(Dispatchers.IO) {
                      val prefs = getApplication<Application>().getSharedPreferences("tmdb", Context.MODE_PRIVATE)
                      fun build() = defs.mapNotNull { (title, path, tv) ->
                          prefs.getString(path, null)
                              ?.let { runCatching { Shelf(title, Tmdb.parse(it, tv)) }.getOrNull() }
                              ?.takeIf { it.items.isNotEmpty() }
                      }
                      _shelves.value = build()                       // instant from cache
                      defs.forEach { (_, path, _) ->                 // then refresh
                          Tmdb.get(path)?.let { prefs.edit().putString(path, it).apply() }
                          _shelves.value = build()
                      }
                  }
              }
          
              private fun queryApps(): List<AppEntry> {
                  val ctx = getApplication<Application>()
                  val pm = ctx.packageManager
                  val tv = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
                  val std = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val priority = listOf("stremio", "nuvio")
                  return (pm.queryIntentActivities(tv, 0) + pm.queryIntentActivities(std, 0))
                      .distinctBy { it.activityInfo.packageName }
                      .filter { it.activityInfo.packageName != ctx.packageName }
                      .mapNotNull { ri ->
                          val pkg = ri.activityInfo.packageName
                          val intent = pm.getLeanbackLaunchIntentForPackage(pkg)
                              ?: pm.getLaunchIntentForPackage(pkg) ?: return@mapNotNull null
                          val banner = (ri.activityInfo.loadBanner(pm) ?: ri.activityInfo.applicationInfo.loadBanner(pm))
                              ?.toBitmap(320, 180)?.asImageBitmap()
                          AppEntry(
                              ri.loadLabel(pm).toString(), pkg,
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                              banner, ri.loadIcon(pm).toBitmap(192, 192).asImageBitmap(),
                          )
                      }
                      .sortedBy { a -> priority.indexOfFirst { a.label.contains(it, true) }.let { if (it < 0) 99 else it } }
              }
          
              override fun onCleared() {
                  getApplication<Application>().unregisterReceiver(receiver)
              }
          }
          
          // ───────────────────────── activity ─────────────────────────
          
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val vm: AppsViewModel = viewModel()
                      val apps by vm.apps.collectAsState()
                      val shelves by vm.shelves.collectAsState()
                      val ctx = LocalContext.current
                      val scope = rememberCoroutineScope()
                      BackHandler {}
                      Home(
                          apps, shelves,
                          onApp = { runCatching { startActivity(it.intent) } },
                          onTitle = { t ->
                              scope.launch {
                                  val imdb = withContext(Dispatchers.IO) { Tmdb.imdbId(t) }
                                  val uri = when {
                                      imdb == null -> null
                                      t.isTv -> "stremio:///detail/series/$imdb"
                                      else -> "stremio:///detail/movie/$imdb/$imdb"
                                  }
                                  val ok = uri != null && runCatching {
                                      ctx.startActivity(Intent(Intent.ACTION_VIEW, uri.toUri()).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                                  }.isSuccess
                                  if (!ok) Toast.makeText(ctx, "Couldn't open Stremio for ${t.name}", Toast.LENGTH_LONG).show()
                              }
                          },
                      )
                  }
              }
          }
          
          // ───────────────────────── UI ─────────────────────────
          
          @OptIn(ExperimentalTvMaterial3Api::class)
          @Composable
          fun Home(apps: List<AppEntry>, shelves: List<Shelf>, onApp: (AppEntry) -> Unit, onTitle: (Title) -> Unit) {
              val trending = shelves.firstOrNull()?.items.orEmpty()
              var hero by remember { mutableStateOf<Title?>(null) }
              var rotating by remember { mutableStateOf(true) }
              val firstFocus = remember { FocusRequester() }
          
              LaunchedEffect(trending.size, rotating) {
                  if (trending.isEmpty()) return@LaunchedEffect
                  if (hero == null) hero = trending[0]
                  if (rotating) {
                      var i = trending.indexOf(hero).coerceAtLeast(0)
                      while (true) { delay(9000); i = (i + 1) % trending.size; hero = trending[i] }
                  }
              }
              LaunchedEffect(apps.isNotEmpty()) {
                  if (apps.isNotEmpty()) runCatching { firstFocus.requestFocus() }
              }
          
              val heroUrl = hero?.let { Tmdb.IMG + "w1280" + it.backdrop }
          
              Box(Modifier.fillMaxSize().background(Color(0xFF05070D))) {
                  Crossfade(heroUrl, animationSpec = tween(800), label = "hero") { url ->
                      if (url != null) AsyncImage(url, null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  }
                  Box(Modifier.fillMaxSize().background(Brush.horizontalGradient(listOf(Color(0xE6000000), Color(0x66000000), Color.Transparent))))
                  Box(Modifier.fillMaxSize().background(Brush.verticalGradient(0.35f to Color.Transparent, 0.75f to Color(0xB3000000), 1f to Color(0xF2000000))))
          
                  Clock(Modifier.align(Alignment.TopEnd).padding(horizontal = 64.dp, vertical = 36.dp))
          
                  Column(Modifier.fillMaxSize()) {
                      HeroInfo(hero, BuildConfig.TMDB_KEY.isBlank(), Modifier.weight(0.42f).fillMaxWidth())
                      LazyColumn(Modifier.weight(0.58f), contentPadding = PaddingValues(bottom = 48.dp)) {
                          item {
                              Glass(Modifier.padding(horizontal = 48.dp).fillMaxWidth(), RoundedCornerShape(30.dp), heroUrl) {
                                  LazyRow(
                                      contentPadding = PaddingValues(horizontal = 28.dp, vertical = 22.dp),
                                      horizontalArrangement = Arrangement.spacedBy(22.dp),
                                  ) {
                                      itemsIndexed(apps, key = { _, a -> a.pkg }) { i, app ->
                                          AppTile(
                                              app,
                                              if (i == 0) Modifier.focusRequester(firstFocus) else Modifier,
                                              onFocus = { rotating = true },
                                              onClick = { onApp(app) },
                                          )
                                      }
                                  }
                              }
                          }
                          items(shelves, key = { it.title }) { shelf ->
                              Text(shelf.title, Modifier.padding(start = 64.dp, top = 28.dp, bottom = 4.dp),
                                  color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.SemiBold)
                              LazyRow(
                                  contentPadding = PaddingValues(horizontal = 64.dp, vertical = 16.dp),
                                  horizontalArrangement = Arrangement.spacedBy(20.dp),
                              ) {
                                  items(shelf.items, key = { "${it.isTv}-${it.id}" }) { t ->
                                      TitleCard(t, onFocus = { hero = t; rotating = false }, onClick = { onTitle(t) })
                                  }
                              }
                          }
                      }
                  }
              }
          }
          
          @OptIn(ExperimentalTvMaterial3Api::class)
          @Composable
          fun HeroInfo(t: Title?, noKey: Boolean, modifier: Modifier) {
              Column(modifier.padding(start = 64.dp, top = 52.dp, end = 64.dp), verticalArrangement = Arrangement.Bottom) {
                  if (t == null) {
                      Text("Aurora", color = Color.White, fontSize = 40.sp, fontWeight = FontWeight.Bold)
                      if (noKey) Text("Add your TMDB key to show movies here", color = Color.White.copy(.7f), fontSize = 18.sp)
                      return@Column
                  }
                  Text(t.name, color = Color.White, fontSize = 38.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  Text(
                      listOf(if (t.isTv) "Series" else "Movie", t.year, "★ " + "%.1f".format(t.rating)).filter { it.isNotBlank() }.joinToString("   •   "),
                      Modifier.padding(top = 6.dp), color = Color.White.copy(.8f), fontSize = 18.sp,
                  )
                  Text(t.overview, Modifier.padding(top = 10.dp, bottom = 12.dp).fillMaxWidth(0.5f),
                      color = Color.White.copy(.85f), fontSize = 17.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
              }
          }
          
          /** Frosted-glass panel. On Android 12+ it blurs a copy of the backdrop behind it; older TVs get a frosted gradient. */
          @Composable
          fun Glass(modifier: Modifier, shape: Shape, bgUrl: String?, content: @Composable () -> Unit) {
              var pos by remember { mutableStateOf(Offset.Zero) }
              val cfg = LocalConfiguration.current
              Box(modifier.clip(shape).onGloballyPositioned { pos = it.positionInRoot() }) {
                  if (Build.VERSION.SDK_INT >= 31 && bgUrl != null) {
                      Box(Modifier.matchParentSize()) {
                          AsyncImage(
                              bgUrl, null,
                              Modifier.requiredSize(cfg.screenWidthDp.dp, cfg.screenHeightDp.dp)
                                  .offset { IntOffset(-pos.x.roundToInt(), -pos.y.roundToInt()) }
                                  .blur(36.dp, BlurredEdgeTreatment.Unbounded),
                              contentScale = ContentScale.Crop,
                          )
                      }
                  }
                  Box(
                      Modifier.matchParentSize()
                          .background(Brush.verticalGradient(listOf(Color.White.copy(.20f), Color.White.copy(.07f))))
                          .border(1.dp, Brush.verticalGradient(listOf(Color.White.copy(.55f), Color.White.copy(.08f))), shape)
                  )
                  content()
              }
          }
          
          @OptIn(ExperimentalTvMaterial3Api::class)
          @Composable
          fun AppTile(app: AppEntry, modifier: Modifier, onFocus: () -> Unit, onClick: () -> Unit) {
              val shape = RoundedCornerShape(18.dp)
              var focused by remember { mutableStateOf(false) }
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Surface(
                      onClick = onClick,
                      modifier = modifier.width(190.dp).aspectRatio(16f / 9f)
                          .onFocusChanged { focused = it.isFocused; if (it.isFocused) onFocus() },
                      shape = ClickableSurfaceDefaults.shape(shape),
                      scale = ClickableSurfaceDefaults.scale(focusedScale = 1.12f),
                      glow = ClickableSurfaceDefaults.glow(focusedGlow = Glow(Color.White.copy(.35f), 22.dp)),
                      colors = ClickableSurfaceDefaults.colors(
                          containerColor = Color(0x30FFFFFF), focusedContainerColor = Color(0x55FFFFFF)),
                  ) {
                      if (app.banner != null) {
                          Image(app.banner, null, Modifier.fillMaxSize().clip(shape), contentScale = ContentScale.Crop)
                      } else {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Image(app.icon, null, Modifier.size(80.dp)) }
                      }
                  }
                  Text(app.label, Modifier.padding(top = 12.dp), maxLines = 1, overflow = TextOverflow.Ellipsis,
                      color = Color.White.copy(if (focused) 1f else 0f), fontSize = 16.sp)
              }
          }
          
          @OptIn(ExperimentalTvMaterial3Api::class)
          @Composable
          fun TitleCard(t: Title, onFocus: () -> Unit, onClick: () -> Unit) {
              val shape = RoundedCornerShape(16.dp)
              Surface(
                  onClick = onClick,
                  modifier = Modifier.width(270.dp).aspectRatio(16f / 9f).onFocusChanged { if (it.isFocused) onFocus() },
                  shape = ClickableSurfaceDefaults.shape(shape),
                  scale = ClickableSurfaceDefaults.scale(focusedScale = 1.1f),
                  glow = ClickableSurfaceDefaults.glow(focusedGlow = Glow(Color.White.copy(.3f), 20.dp)),
                  colors = ClickableSurfaceDefaults.colors(containerColor = Color(0x30FFFFFF), focusedContainerColor = Color(0x55FFFFFF)),
              ) {
                  Box(Modifier.fillMaxSize()) {
                      AsyncImage(Tmdb.IMG + "w500" + t.backdrop, null, Modifier.fillMaxSize().clip(shape), contentScale = ContentScale.Crop)
                      Box(Modifier.matchParentSize().background(Brush.verticalGradient(0.55f to Color.Transparent, 1f to Color(0xCC000000))))
                      Text(t.name, Modifier.align(Alignment.BottomStart).padding(12.dp), color = Color.White,
                          fontSize = 15.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
              }
          }
          
          @OptIn(ExperimentalTvMaterial3Api::class)
          @Composable
          fun Clock(modifier: Modifier) {
              var t by remember { mutableStateOf(now()) }
              LaunchedEffect(Unit) { while (true) { t = now(); delay(10_000) } }
              Text(t, modifier, color = Color.White.copy(.92f), fontSize = 26.sp, fontWeight = FontWeight.Medium)
          }
          
          private fun now(): String = SimpleDateFormat("h:mm a", Locale.getDefault()).format(Date())
          EOF
      - name: Build release APK
        working-directory: aurora
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: gradle assembleRelease --no-daemon -PTMDB_KEY="$TMDB_KEY"
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aurora Launcher (latest)
          files: aurora/app/build/outputs/apk/release/app-release.apk
